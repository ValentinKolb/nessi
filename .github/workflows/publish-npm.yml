name: Publish npm

on:
  push:
    tags:
      - "nessi-v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Typecheck
        run: bun run --filter @k2b/nessi typecheck
      - name: Test
        run: bun run --filter @k2b/nessi test
      - name: Build npm package
        run: bun run build:nessi

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry=https://registry.npmjs.org

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11.5.1+
        run: npm install -g npm@11.5.1

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#nessi-v}"
          VERSION="$VERSION" node -e '
            const fs = require("node:fs");
            const path = "packages/nessi/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          '

      - name: Build npm package
        run: bun run build:nessi

      - name: Publish @k2b/nessi
        run: npm publish --provenance --access public
        working-directory: ./packages/nessi/dist
